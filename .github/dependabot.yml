version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    groups:
      client-dependencies:
        patterns:
          - "*"
